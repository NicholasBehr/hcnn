[project]
name = "hcnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "brax>=0.12.3",
    "flax>=0.10.5",
    "jax>=0.5.3",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.5.3"]

[project.scripts]
hcnn = "hcnn:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab>=4.4.0",
    "pyright>=1.1.398",
    "pytest>=8.3.5",
    "ruff>=0.11.4",
]
plot = [
    "matplotlib>=3.10.1",
    "networkx>=3.4.2",
]

[tool.ruff]
exclude = [".venv"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # Pycodestyle (formatting errors)
    "W",  # Pycodestyle (warnings)
    "F",  # Pyflakes (static errors)
    "I",  # isort (import sorting)
    "N",  # Naming conventions
    "B",  # Bugbear (security and performance issues)
    "C90", # McCabe (complexity checks)
    "PL",  # Pylint rules (optional)
]
ignore = ["D"]  # Ignore docstring warnings
