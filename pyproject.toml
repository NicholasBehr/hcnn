[project]
name = "hcnn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flax>=0.10.5",
    "jax>=0.6.2",
    "mediapy>=1.2.4",
    "mujoco-mjx>=3.3.3",
    "pillow>=11.3.0",
    "wandb>=0.20.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab>=4.4.0",
    "pyright>=1.1.398",
    "pytest>=8.3.5",
    "ruff>=0.11.4",
    "matplotlib>=3.10.1",
]

[tool.ruff]
exclude = [".venv"]
line-length = 80
target-version = "py313"

[tool.pyright]
include = [
    "src",
]

[tool.ruff.lint]
select = [
    "E",  # Pycodestyle (formatting errors)
    "W",  # Pycodestyle (warnings)
    "F",  # Pyflakes (static errors)
    "I",  # isort (import sorting)
    "N",  # Naming conventions
    "B",  # Bugbear (security and performance issues)
    "C90", # McCabe (complexity checks)
    "PL",  # Pylint rules (optional)
]
ignore = ["D", "PLR0913"]  # Ignore docstring warnings and too many fun argnums

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # allow unused imports
"test_*" = ["PLR2004"] # allow magic values for tests
